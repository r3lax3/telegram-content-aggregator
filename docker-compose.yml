services:
  postgres:
    image: postgres:15-alpine
    container_name: tgstat_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: bot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  scrapper:
    build:
      context: ./scrapper
      dockerfile: Dockerfile
    container_name: tgstat_scrapper
    env_file:
      - scrapper.env
    ports:
      - "5000:5000"
    volumes:
      - ./scrapper:/app
      - /app/__pycache__
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: tgstat_bot
    env_file:
      - bot.env
    volumes:
      - ./bot:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      scrapper:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
